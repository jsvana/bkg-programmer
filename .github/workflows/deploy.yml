name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Prevent concurrent deploys from racing on the gh-pages branch.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate schema
        run: npm run validate-schema

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload export
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 7

  deploy:
    name: Deploy to gh-pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download export
        uses: actions/download-artifact@v4
        with:
          name: out
          path: out

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          # CNAME is shipped inside out/ (copied from public/), so no
          # extra `cname:` input is needed — peaceiris preserves it.
          commit_message: ${{ github.event.head_commit.message }}
